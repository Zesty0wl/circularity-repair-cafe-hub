<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You are offline</title>
    <!-- Standalone on purpose. This page is shown when the network is gone, so
         it cannot rely on any stylesheet or font being fetched. -->
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #fbf7ef;
        color: #1c2622;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        line-height: 1.6;
      }
      main { max-width: 26rem; text-align: center; }
      h1 { margin: 0 0 0.75rem; font-size: 1.5rem; }
      p { margin: 0 0 1.5rem; color: #45525c; }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #1c2622;
        border: 0;
        border-radius: 0.75rem;
        padding: 0.75rem 1.5rem;
        cursor: pointer;
      }
      button:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>We cannot reach the site right now. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
