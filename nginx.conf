# =============================================================================
#  Circularity Repair Cafe Hub — nginx reverse proxy
#  Public hostname:  repaircafe.circularity.org
#  Backend:          http://127.0.0.1:5026  (container exposed on the host)
#  TLS:              Cloudflare Origin wildcard cert (*.circularity.org)
#
#  Install:
#     sudo cp nginx.conf /etc/nginx/sites-available/repaircafe.circularity.org
#     sudo ln -s /etc/nginx/sites-available/repaircafe.circularity.org \
#                /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# --- HTTP → HTTPS redirect ---------------------------------------------------
server {
    listen      80;
    server_name repaircafe.circularity.org;
    return 301 https://$host$request_uri;
}

# --- Main HTTPS server -------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name repaircafe.circularity.org;
    ssl_stapling off;

    # Big enough for high-resolution repair photos
    client_max_body_size 25M;
    client_body_timeout  120s;

    # Cloudflare Origin wildcard cert that covers *.circularity.org
    ssl_certificate     /etc/ssl/certs/cloudflare/cloudflare_circularity.pem;
    ssl_certificate_key /etc/ssl/certs/cloudflare/cloudflare_circularity.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 10m;

    # Security headers (the app sets its own CSP via helmet)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Gzip — text/JSON only; images & QR PNGs are already compressed
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml application/xml+rss image/svg+xml;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_disable "msie6";

    access_log /var/log/nginx/repaircafe.circularity.org.access.log;
    error_log  /var/log/nginx/repaircafe.circularity.org.error.log warn;

    # Long-cache for hashed SvelteKit assets
    location /_app/immutable/ {
        proxy_pass http://127.0.0.1:5026;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # User-uploaded media (photos, QR codes, branding) — short cache
    location /uploads/ {
        proxy_pass http://127.0.0.1:5026;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=300";
    }

    # Everything else → the app
    location / {
        proxy_pass http://127.0.0.1:5026;
        proxy_http_version 1.1;

        # Forward identity + scheme so Fastify (TRUST_PROXY=true) issues
        # secure cookies and rate-limits per real client IP correctly.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # WebSocket / EventSource friendly (future-proofing)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Stream uploads/downloads
        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
